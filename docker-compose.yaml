services:
  slam_toolbox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ros_slam_toolbox
    stdin_open: true
    tty: true
    privileged: true
    environment:
      - ROS_DISTRO=humble
      - DISPLAY=${DISPLAY}
    volumes:
      - ./src:/ros2_ws/src
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    devices:
      - /dev:/dev
    command: bash
