services:
  slam_toolbox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ros_slam_toolbox
    stdin_open: true
    tty: true
    privileged: true
    environment:
      - ROS_DISTRO=humble
      - DISPLAY=${DISPLAY}
    volumes:
      - ./src:/ros2_ws/src
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    devices:
      - /dev:/dev
    command: bash
  micro_ros_agent:
    container_name: micro_ros_agent
    image: registry.gitlab.com/araoof01/thesis:latest  # or a specific agent image
    command: >
      bash -c "
      source /opt/ros/$ROS_DISTRO/setup.bash &&
      ros2 run micro_ros_agent micro_ros_agent serial --dev /dev/ttyUSB0
      "
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    privileged: true