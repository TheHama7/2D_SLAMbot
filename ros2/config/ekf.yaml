ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Wheel odom (encoders) — use pose & twist in x/y/yaw
    odom0: /wheel_odom
    odom0_differential: false
    odom0_queue_size: 10
    odom0_pose_rejection_threshold: 5.0
    odom0_twist_rejection_threshold: 5.0
    odom0_config: [ true,  true,  false,
                    false, false, true,
                    false, false, false,
                    false, false, true,
                    true,  true,  false]

    # IMU — use angular velocity (gz) + linear accel (ax, ay)
    imu0: /imu/data
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: true
    imu0_differential: false
    imu0_relative: false
    imu0_pose_rejection_threshold: 5.0
    imu0_twist_rejection_threshold: 5.0
    imu0_config: [ false, false, false,
                   false, false, true,   # yaw if you provide orientation; here we don't
                   true,  true,  true,   # angular velocity
                   true,  true,  false ] # linear accel x,y

    publish_tf: true
