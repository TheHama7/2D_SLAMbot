<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Robot Control Center</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/roslib/build/roslib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.9.0/dist/nipplejs.min.js"></script>
    <style>
      body { font-family:sans-serif; background:#111; color:#eee; margin:0; overflow:hidden; }
      #status { padding:10px; text-align:center; }
      #mapFrame { width:100%; height:60vh; border:none; }
      #joystick { position:fixed; bottom:10vh; left:50%; transform:translateX(-50%); width:200px; height:200px; }
    </style>
  </head>
  <body>
    <div id="status">🔴 Disconnected</div>

    <!-- Live map from Foxglove Studio embed -->
    <iframe id="mapFrame" src="https://studio.foxglove.dev/?layout=slam_basic"
            allowfullscreen></iframe>

    <div id="joystick"></div>

    <script>
      const ros = new ROSLIB.Ros({ url: "ws://" + window.location.hostname + ":9090" });
      const cmdVel = new ROSLIB.Topic({
        ros: ros,
        name: "/cmd_vel",
        messageType: "geometry_msgs/msg/Twist"
      });

      ros.on("connection", () => document.getElementById("status").innerHTML = "🟢 Connected to ROSBridge");
      ros.on("close", () => document.getElementById("status").innerHTML = "🔴 Disconnected");
      ros.on("error", () => document.getElementById("status").innerHTML = "⚠️ Connection error");

      // Create virtual joystick
      const joystick = nipplejs.create({
        zone: document.getElementById("joystick"),
        color: "cyan",
        size: 150,
        mode: "static",
        position: { left: "50%", top: "50%" }
      });

      let lastSend = 0;
      joystick.on("move", (evt, data) => {
        const now = Date.now();
        if (now - lastSend > 100) { // send every 100 ms
          const forward = data.vector.y * -0.4;  // max 0.4 m/s
          const turn = data.vector.x * -1.5;     // max 1.5 rad/s
          const twist = new ROSLIB.Message({
            linear: { x: forward, y: 0, z: 0 },
            angular: { x: 0, y: 0, z: turn }
          });
          cmdVel.publish(twist);
          lastSend = now;
        }
      });
      joystick.on("end", () => cmdVel.publish(new ROSLIB.Message({linear:{x:0},angular:{z:0}})));
    </script>
  </body>
</html>
