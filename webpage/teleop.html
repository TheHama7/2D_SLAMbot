<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Robot Control Center</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/roslib/build/roslib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.9.0/dist/nipplejs.min.js"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #111;
        color: #eee;
        margin: 0;
        overflow: hidden;
      }
      header {
        padding: 10px;
        text-align: center;
        background: #222;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
      }
      #status {
        font-weight: bold;
        transition: color 0.3s;
      }
      #rosUrl {
        background: #000;
        color: #eee;
        border: 1px solid #444;
        padding: 4px 8px;
        border-radius: 6px;
        width: 200px;
      }
      #connectBtn {
        background: #0af;
        color: #000;
        border: none;
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
      }
      #connectBtn:hover {
        background: #08c;
      }
      #mapFrame {
        width: 100%;
        height: 60vh;
        border: none;
      }
      #joystick {
        position: fixed;
        bottom: 10vh;
        left: 50%;
        transform: translateX(-50%);
        width: 200px;
        height: 200px;
      }
      footer {
        position: fixed;
        bottom: 5px;
        width: 100%;
        text-align: center;
        font-size: 0.9em;
        color: #666;
      }
    </style>
  </head>
  <body>
    <header>
      <input id="rosUrl" placeholder="ws://localhost:9090" value="ws://localhost:9090">
      <button id="connectBtn">Connect</button>
      <div id="status">🔴 Disconnected</div>
    </header>

    <!-- Foxglove Studio live map -->
    <iframe id="mapFrame" src="https://studio.foxglove.dev/?layout=slam_basic" allowfullscreen></iframe>

    <div id="joystick"></div>

    <footer>
      💻 Use joystick or WASD keys to move (test mode works even without ROS)
    </footer>

    <script>
      let ros = null;
      let cmdVel = null;
      let moveData = null;

      const statusEl = document.getElementById("status");
      function setStatus(text, color) {
        statusEl.innerHTML = text;
        statusEl.style.color = color;
      }

      function connectROS() {
        const url = document.getElementById("rosUrl").value.trim();
        if (ros) ros.close();
        ros = new ROSLIB.Ros({ url });

        cmdVel = new ROSLIB.Topic({
          ros: ros,
          name: "/cmd_vel",
          messageType: "geometry_msgs/msg/Twist"
        });

        ros.on("connection", () => setStatus("🟢 Connected", "lime"));
        ros.on("close", () => setStatus("🔴 Disconnected", "red"));
        ros.on("error", () => setStatus("⚠️ Connection error", "yellow"));
      }

      document.getElementById("connectBtn").addEventListener("click", connectROS);

      // Joystick setup
      const joystick = nipplejs.create({
        zone: document.getElementById("joystick"),
        color: "cyan",
        size: 150,
        mode: "static",
        position: { left: "50%", top: "50%" }
      });

      joystick.on("move", (evt, data) => moveData = data);
      joystick.on("end", () => {
        moveData = null;
        publishCmd(0, 0);
      });

      function publishCmd(forward, turn) {
        if (!cmdVel) return; // allows frontend test mode
        const twist = new ROSLIB.Message({
          linear: { x: forward, y: 0, z: 0 },
          angular: { x: 0, y: 0, z: turn }
        });
        cmdVel.publish(twist);
      }

      // Continuous update loop
      function loop() {
        if (moveData) {
          const forward = moveData.vector.y * -0.4;
          const turn = moveData.vector.x * -1.5;
          publishCmd(forward, turn);
        }
        requestAnimationFrame(loop);
      }
      loop();

      // Keyboard control
      document.addEventListener("keydown", e => {
        const speed = 0.4, turn = 1.5;
        if (e.repeat) return; // ignore key hold repeats
        if (e.key === "w") publishCmd(speed, 0);
        if (e.key === "s") publishCmd(-speed, 0);
        if (e.key === "a") publishCmd(0, turn);
        if (e.key === "d") publishCmd(0, -turn);
      });
      document.addEventListener("keyup", e => {
        if (["w","a","s","d"].includes(e.key)) publishCmd(0, 0);
      });

      // Auto-connect to default localhost on load (for testing)
      connectROS();
    </script>
  </body>
</html>
